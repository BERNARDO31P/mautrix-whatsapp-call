name: source-check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install PyYAML
      - run: bash build/verify-source.sh
      - run: python -B tests/test_project.py
      - run: for test in tests/shell/*.sh; do bash "$test"; done

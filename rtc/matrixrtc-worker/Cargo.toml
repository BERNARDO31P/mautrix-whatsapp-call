[package]
name = "matrixrtc-whatsapp-worker"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only OR LicenseRef-Element-Commercial"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "fs", "process"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# Full encrypted call integration is optional for protocol/unit checks.
matrix-rtc-call-sdk = { path = "../crates/matrix-rtc-call-sdk", features = ["matrix-sdk"], optional = true }
matrix-rtc-core = { path = "../crates/matrix-rtc-core", optional = true }
matrix-rtc-call = { path = "../crates/matrix-rtc-call", optional = true }
matrix-rtc-transport = { path = "../crates/matrix-rtc-transport", optional = true }
matrix-sdk = { workspace = true, optional = true }
matrix-sdk-ui = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { version = "0.23", features = ["aws_lc_rs"], optional = true }
livekit = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }

[features]
default = []
provision = ["matrix-sdk"]
rtc = ["provision", "matrix-rtc-call-sdk", "matrix-rtc-core", "matrix-rtc-call", "matrix-rtc-transport", "matrix-sdk-ui", "reqwest", "rustls", "livekit", "futures-util"]

[[bin]]
name = "matrixrtc-ghost-provision"
path = "src/bin/matrixrtc-ghost-provision.rs"
required-features = ["provision"]

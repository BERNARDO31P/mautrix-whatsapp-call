# Paste INSIDE your existing `server_name __MATRIXRTC_SERVER_NAME__` HTTPS (443)
# server block, BEFORE `include ssl; include security;`. Do not add to port 8448.
# The prefix must be stripped: both upstream services serve paths at /.
location ^~ /livekit/jwt {
    rewrite ^/livekit/jwt/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
}
location ^~ /livekit/sfu {
    rewrite ^/livekit/sfu/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}

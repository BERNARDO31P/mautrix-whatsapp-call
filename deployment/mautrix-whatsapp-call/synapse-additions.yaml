# Merge these keys into /opt/matrix/synapse/homeserver.yaml.
# DO NOT replace that file: it has your database, signing, and appservice settings.
# Requires a recent Synapse release (target v1.165.0 or newer).
# Under the existing app_service_config_files list, also ADD:
#   - /data/matrixrtc-registration.yaml
experimental_features:
  msc4143_enabled: true
  msc4354_enabled: true
  msc4222_enabled: true
  msc4502_enabled: true
  msc4512_enabled: true
max_event_delay_duration: 24h
matrix_rtc:
  transports:
    - type: m.livekit
      url: wss://__MATRIXRTC_SERVER_NAME__/livekit/sfu
      livekit_service_url: https://__MATRIXRTC_SERVER_NAME__/livekit/jwt
    - type: livekit
      url: wss://__MATRIXRTC_SERVER_NAME__/livekit/sfu
      livekit_service_url: https://__MATRIXRTC_SERVER_NAME__/livekit/jwt
